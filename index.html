<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabliczka mnożenia</title>
<meta name="theme-color" content="#2a3439">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mnożenie">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a3439;--cyan:#26b3e2;--white:#fff;--good:#4ade80;--bad:#ff6b6b;--fix:#ffc857;--muted:#8fa0a8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:#1f272b;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--white)}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden}
#track{display:flex;width:300%;height:calc(100% - 44px);transition:transform .35s ease}
.panel{width:33.3333%;height:100%;display:flex;flex-direction:column;padding:0 22px;min-width:0}
h1{margin:28px 0 14px;text-align:center;color:var(--cyan);font-size:30px;line-height:1.15;font-weight:700}
.sub{margin:0 0 10px;text-align:center;color:var(--muted);font-size:14px}
#list{flex:1;overflow-y:auto;padding:4px 0 16px;margin:0 auto;width:100%;max-width:340px}
.row{display:grid;grid-template-columns:150px 1fr;align-items:center;min-height:50px;font-size:30px;font-weight:700;color:var(--cyan);white-space:nowrap}
.row .a{display:flex;align-items:center;gap:10px;font-size:26px}
.row input{width:96px;font:inherit;color:var(--white);background:transparent;border:0;border-bottom:2px solid var(--cyan);outline:0;padding:2px 0;border-radius:0;-moz-appearance:textfield}
.row input::-webkit-outer-spin-button,.row input::-webkit-inner-spin-button{-webkit-appearance:none}
.row .go{font:600 15px Inter,sans-serif;color:var(--bg);background:var(--cyan);border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
.row svg{width:26px;height:26px;flex:none}
.row.ok .mine{color:var(--good)} .row.bad .mine{color:var(--bad);text-decoration:line-through}
.row .fix{color:var(--fix)}
.dock{padding:10px 0 12px;display:flex;justify-content:center;min-height:62px}
.btn{font:700 17px Inter,sans-serif;color:var(--bg);background:var(--cyan);border:0;border-radius:12px;padding:14px 34px;cursor:pointer}
.btn:focus-visible,.go:focus-visible,.dot:focus-visible{outline:3px solid var(--white);outline-offset:2px}
.hide{visibility:hidden}
#res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
#res svg{width:120px;height:120px}
#res .big{font-size:56px;font-weight:700;color:var(--white);line-height:1}
#res .line{font-size:20px;color:var(--white)} #res .line b{font-weight:700}
#hist{flex:1;overflow-y:auto;margin:0 auto;width:100%;max-width:340px;padding-bottom:12px}
.h{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:18px}
.h .n{color:var(--cyan);font-weight:600}.h .g{color:var(--good);font-weight:600}.h .b{color:var(--bad);font-weight:600}
.empty{text-align:center;color:var(--muted);margin-top:40px;font-size:16px}
#dots{height:44px;display:flex;align-items:center;justify-content:center;gap:14px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--white);background:transparent;padding:0;cursor:pointer}
.dot.on{background:var(--white)}
@media (prefers-reduced-motion:reduce){#track{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="track">
    <section class="panel" aria-label="Test">
      <h1 id="title">Test nr. 1</h1>
      <div id="list"></div>
      <div class="dock"><button class="btn hide" id="new1">Nowy Test</button></div>
    </section>
    <section class="panel" aria-label="Wynik testu">
      <h1>Wynik testu</h1>
      <div id="res"><p class="sub">Ukończ test, aby zobaczyć wynik.</p></div>
      <div class="dock"><button class="btn hide" id="new2">Nowy Test</button></div>
    </section>
    <section class="panel" aria-label="Historia">
      <h1>Wyniki z 20 ostatnich testów</h1>
      <div id="hist"></div>
    </section>
  </div>
  <div id="dots"></div>
</div>

};
const ICON_UP = '<svg viewBox="0 0 24 24" fill="#4ade80" aria-label="dobrze"><path d="M2 21h4V9H2v12zM23 10a2 2 0 0 0-2-2h-6.3l1-4.6v-.3c0-.4-.2-.8-.4-1.1L14.2 1 7.6 7.6C7.2 8 7 8.500 7 9v10a2 2 0 0 0 2 2h9c.8 0 1.500-.5 1.800-1.200l3-7c.1-.3.2-.5.2-.8v-2z"/></svg>';
const ICON_DOWN = '<svg viewBox="0 0 24 24" fill="#ff6b6b" aria-label="źle" style="transform:scaleY(-1)"><path d="M2 21h4V9H2v12zM23 10a2 2 0 0 0-2-2h-6.3l1-4.6v-.3c0-.4-.2-.8-.4-1.100L14.200 1 7.600 7.600C7.200 8 7 8.500 7 9v10a2 2 0 0 0 2 2h9c.8 0 1.500-.5 1.800-1.200l3-7c.1-.3.2-.5.2-.8v-2z"/></svg>';

// ===== Zapis (localStorage z zabezpieczeniem) =====
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let used = new Set(store.get("mn_used", []));   // wykorzystane kombinacje
let history = store.get("mn_hist", []);         // [{n,good,bad}]
let done = store.get("mn_done", 0);             // liczba ukończonych testów

// ===== Losowanie testu bez powtórek =====
function allCombos(){
  const r = [];
  for(let a = FIRST_MIN; a <= FIRST_MAX; a++) for(let b = SECOND_MIN; b <= SECOND_MAX; b++) r.push(a + "x" + b);
  return r;
}
function shuffle(arr){ for(let i = arr.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function pickTest(){
  const all = allCombos();
  let fresh = shuffle(all.filter(c => !used.has(c)));
  let pick = fresh.slice(0, TEST_SIZE);
  if(pick.length < TEST_SIZE){            // wszystkie kombinacje wykorzystane – zaczynamy od nowa
    const rest = shuffle(all.filter(c => !pick.includes(c)));
    pick = pick.concat(rest.slice(0, TEST_SIZE - pick.length));
    used = new Set(pick.slice(fresh.length)); // nowy obieg: zaznacz tylko te dobrane po resecie
    store.set("mn_used", [...used]);
  }
  return pick.map(c => c.split("x").map(Number));
}

// ===== Stan testu =====
let questions = [], cur = 0, good = 0, bad = 0, finished = false;
const $ = id => document.getElementById(id);
const list = $("list");

function newTest(){
  questions = pickTest(); cur = 0; good = 0; bad = 0; finished = false;
  $("title").textContent = "Test nr. " + (done + 1);
  $("new1").classList.add("hide"); $("new2").classList.add("hide");
  $("res").innerHTML = '<p class="sub">Ukończ test, aby zobaczyć wynik.</p>';
  list.innerHTML = "";
  questions.forEach(([a, b], i) => {
    const r = document.createElement("div"); r.className = "row"; r.id = "r" + i;
    r.innerHTML = '<span>' + a + '×' + b + '=</span><span class="a"></span>';
    list.appendChild(r);
  });
  go(0); activate(0);
}

function activate(i){
  const row = $("r" + i), slot = row.querySelector(".a");
  slot.innerHTML = '<input inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Twoja odpowiedź"><button class="go" type="button">OK</button>';
  const inp = slot.querySelector("input");
  const submit = () => answer(i, inp.value.trim());
  inp.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); submit(); } });
  inp.addEventListener("input", () => { inp.value = inp.value.replace(/\D/g, ""); });
  slot.querySelector(".go").addEventListener("click", submit);
  row.scrollIntoView({block: "center", behavior: "smooth"});
  if(index === 0) inp.focus({preventScroll: true});
}

function play(a){ try{ a._real = true; a.muted = false; a.currentTime = 0; const p = a.play(); if(p) p.catch(() => {}); }catch(e){} }

function answer(i, val){
  if(val === "") return;
  const [a, b] = questions[i], right = a * b, mine = Number(val);
  const row = $("r" + i), slot = row.querySelector(".a");
  const ok = mine === right;
  row.classList.add(ok ? "ok" : "bad");
  slot.innerHTML = '<span class="mine">' + mine + '</span>' + (ok ? ICON_UP : ICON_DOWN + '<span class="fix">' + right + '</span>');
  if(ok){ good++; play(SND.up); } else { bad++; play(SND.down); }
  cur++;
  if(cur < questions.length) activate(cur);
  else finish();
}

function finish(){
  finished = true;
  questions.forEach(([a, b]) => used.add(a + "x" + b));
  store.set("mn_used", [...used]);
  done++; store.set("mn_done", done);
  const entry = {n: done, good, bad};
  const slotIdx = (done - 1) % HISTORY_SIZE;      // test nr 21 nadpisuje test nr 1 itd.
  history[slotIdx] = entry; store.set("mn_hist", history);
  renderResult(); renderHistory();
  $("new1").classList.remove("hide");
  setTimeout(() => {
    go(1);
    play(bad === 0 ? SND.win : SND.lost);
  }, 1500);
}

function renderResult(){
  const perfect = bad === 0;
  $("res").innerHTML = (perfect ? ICON_UP : ICON_DOWN) +
    '<div class="big">' + good + '/' + questions.length + '</div>' +
    '<div class="line">Dobrze: <b style="color:var(--good)">' + good + '</b></div>' +
    '<div class="line">Źle: <b style="color:var(--bad)">' + bad + '</b></div>' +
    '<p class="sub">' + (perfect ? "Wygrana! 100% poprawnych odpowiedzi." : "Test nierozwiązany. Spróbuj jeszcze raz.") + '</p>';
  $("new2").classList.remove("hide");
}

function renderHistory(){
  const h = history.filter(Boolean).sort((x, y) => y.n - x.n);
  $("hist").innerHTML = h.length ? h.map(e =>
    '<div class="h"><span class="n">Test nr. ' + e.n + '</span><span class="g">✓ ' + e.good + '</span><span class="b">✗ ' + e.bad + '</span></div>'
  ).join("") : '<p class="empty">Brak ukończonych testów.</p>';
}

// ===== Viewporty: kropki, przeciąganie =====
let index = 0;
const dots = $("dots");
for(let i = 0; i < 3; i++){
  const d = document.createElement("button"); d.className = "dot"; d.setAttribute("aria-label", "Ekran " + (i + 1));
  d.addEventListener("click", () => go(i)); dots.appendChild(d);
}
function go(i){
  index = Math.max(0, Math.min(2, i));
  $("track").style.transform = "translateX(" + (-index * 33.3333) + "%)";
  [...dots.children].forEach((d, k) => d.classList.toggle("on", k === index));
}
let sx = null, sy = null;
$("app").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive: true});
$("app").addEventListener("touchend", e => {
  if(sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(index + (dx < 0 ? 1 : -1));
  sx = null;
}, {passive: true});

// odblokowanie dźwięku po pierwszym geście (Safari/iOS)
function unlock(){
  Object.values(SND).forEach(a => { a.muted = true; const p = a.play(); if(p) p.then(() => { if(a._real) return; a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; }); });
  removeEventListener("pointerdown", unlock, true); removeEventListener("keydown", unlock, true);
}
addEventListener("pointerdown", unlock, true); addEventListener("keydown", unlock, true);

$("new1").addEventListener("click", newTest);
$("new2").addEventListener("click", newTest);
renderHistory(); newTest();
</script>
